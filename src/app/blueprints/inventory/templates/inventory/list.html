<!doctype html>
<html>
<body>
    <h1>Itens</h1>
    <a href="{{ url_for('inventory.new_item') }}">Novo Item</a>
    <ul>
        {% for i in items %}
        <li>
            {{ i.nome }} —
            <a href="{{ url_for('inventory.edit_item', id=i.id) }}">Editar</a>
            <!-- formulário simples para delete -->
            <form action="{{ url_for('inventory.delete_item', id=i.id) }}" method="post" style="display:inline">
            <button type="submit">Excluir</button>
            </form>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
